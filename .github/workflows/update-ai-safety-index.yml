name: Update AI Safety Index feeds

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
    - cron: "20 */3 * * *"
    - cron: "50 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-safety-index-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect safety signals and open-web discoveries
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2,17,32,47 * * * *'
        working-directory: ai-safety-index
        run: python3 tools/update-signals.py
      - name: Pick recent safety papers from arXiv
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 */3 * * *'
        working-directory: ai-safety-index
        run: python3 tools/update-papers.py
      - name: Translate new signals and papers into Chinese
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2,17,32,47 * * * *' || github.event.schedule == '20 */3 * * *'
        working-directory: ai-safety-index
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/translate-signals.py
      - name: Refresh public evaluation metadata
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 1 * * *'
        working-directory: ai-safety-index
        run: python3 tools/update-evaluations.py
      - name: Build public status
        working-directory: ai-safety-index
        run: node tools/build-status.mjs
      - name: Verify the static portal
        working-directory: ai-safety-index
        run: |
          node tools/verify-site.mjs
          node tools/verify-framework.mjs
          node tools/verify-results.mjs
          node tools/verify-compact.mjs
          node tools/verify-locales.mjs
          node tools/verify-watch.mjs
          node tools/verify-sources.mjs
          node tools/test-signal-brief.mjs
          node tools/test-paper-brief.mjs
          node tools/test-visitor-stats.mjs
          node --test services/visitor-stats/worker.test.mjs
          python3 -m unittest discover -s tools -p 'test_update_*.py'
      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-safety-index/signals-feed.js ai-safety-index/signals-zh.js ai-safety-index/research-source/signals-zh.json ai-safety-index/research-source/signals-provenance.json ai-safety-index/paper-picks.js ai-safety-index/research-source/paper-picks-provenance.json ai-safety-index/evaluation-data.js ai-safety-index/research-source/evaluation-provenance.json ai-safety-index/status.json
          git diff --cached --quiet || git commit -m "chore: refresh AI safety index feeds"
          git push
