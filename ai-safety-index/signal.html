<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Signal · AI Safety Index">信号 · AI Safety Index</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="news.css">
<script>try{if(localStorage.getItem('asi-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="wrap" id="main"></main>
<script src="signals-feed.js"></script>
<script src="signals-zh.js"></script>
<script src="paper-picks.js"></script>
<script src="i18n.js"></script>
<script src="shell.js"></script>
<script src="news.js"></script>
<script src="signal-brief.js"></script>
<script>
(() => {
  const S = Shell, N = S.news, W = News, B = SignalBrief;
  const { esc, T, title, link, isIncident, dirName, orgName, category } = S;
  S.header('records.html');
  const main = document.getElementById('main');
  const id = S.params().get('id') || '';
  const r = N.signals.find(x => x.id === id);
  if (!r) {
    main.innerHTML = '<div class="sig-missing"><h1>' + T('没有找到这条记录', 'Record not found') + '</h1><p class="sub">'
      + T('编号 ' + esc(id) + ' 不在当前的数据里，可能已经超出保留期。', 'ID ' + esc(id) + ' is not in the current data; it may have aged out.')
      + '</p><p><a href="records.html">' + T('查看全部记录 →', 'See all records →') + '</a></p></div>';
    return;
  }
  const direct = W.related(r, N.signals, 120, 12);
  const ranked = N.signals.filter(x => x.id !== r.id).map(x => {
    const sharedDirections = (r.direction_ids || []).filter(d => (x.direction_ids || []).includes(d)).length;
    const sharedOrgs = (r.orgs || []).filter(o => (x.orgs || []).includes(o)).length;
    const sameCategory = (r.category || r.kind) === (x.category || x.kind);
    const days = Math.abs(S.day(x.date) - S.day(r.date)) / S.DAY;
    const similarity = sharedDirections * 5 + sharedOrgs * 4 + (sameCategory ? 2 : 0);
    return { x, similarity, score: similarity + Math.max(0, 3 - days / 45) };
  }).filter(item => item.similarity > 0).sort((a, b) => b.score - a.score || b.x.date.localeCompare(a.x.date));
  const rel = [];
  const seen = new Set([r.id]);
  for (const x of [...direct, ...ranked.map(item => item.x)]) {
    if (seen.has(x.id)) continue;
    seen.add(x.id);
    rel.push(x);
    if (rel.length === 8) break;
  }
  // Similarity supplies reading context, not proof of a shared event or a chronology.
  const datedContext = rel.slice().sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const kick = x => '<div class="kick"><b class="' + (isIncident(x) ? 'inc' : '') + '">' + esc(category(x)) + '</b><span>' + esc(x.source) + '</span><time datetime="' + esc(x.date) + '">' + esc(x.date) + '</time></div>';
  const brief = B.build(r, { english: S.en, desc: S.desc });
  const recordTitle = brief.title || title(r);
  document.title = recordTitle + ' · AI Safety Index';
  const list = (items, cls = '') => '<ul class="sig-note-list ' + cls + '">' + items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>';
  const paragraphs = items => '<div class="sig-long-copy">' + items.map(item => '<p>' + esc(item) + '</p>').join('') + '</div>';
  const chapter = (number, id, heading, intro, body) => '<section class="sig-chapter" id="' + id + '"><header class="sig-chapter-head"><span>' + number + '</span><div><h2>' + heading + '</h2>' + (intro ? '<p>' + intro + '</p>' : '') + '</div></header>' + body + '</section>';
  const directionTags = (r.direction_ids || []).map(d => '<a class="sig-tag" href="directions.html?dir=' + encodeURIComponent(d) + '">' + esc(dirName(d)) + '</a>').join('');
  const orgTags = (r.orgs || []).map(o => '<span class="sig-tag">' + esc(orgName(o)) + '</span>').join('');
  const relationCards = rel.map(x => '<li><a href="' + W.href(x) + '">' + kick(x) + '<strong>' + esc(title(x)) + '</strong>'
    + (S.desc(x) ? '<p>' + esc(S.desc(x)) + '</p>' : '') + '<span>' + T('查看记录 →', 'Open record →') + '</span></a></li>').join('');
  const sections = [];
  const add = (id, heading, body, intro = '') => sections.push({ id, heading, body, intro });

  if (!brief.reviewed) {
    add('overview', T('摘要', 'Summary'), '<div id="analysis">' + (brief.sourceSummary
      ? paragraphs([brief.sourceSummary])
      : paragraphs([T('来源未提供摘要。请打开原文查看。', 'No summary was supplied. Open the source to read the report.')])) + '</div>');
  }
  if (brief.sourceFacts.length) {
    const sources = '<ul class="sig-note-list">' + brief.sources.map(source => '<li><a href="' + esc(source.url) + '" target="_blank" rel="noopener">' + esc(source.label) + ' ↗</a></li>').join('') + '</ul>';
    const body = paragraphs(brief.sourceFacts) + sources;
    add('facts', T('背景与进展', 'Background'), brief.significance.length ? body : '<div id="analysis">' + body + '</div>');
  }
  if (brief.reviewed && brief.significance.length) add('analysis', T('解读', 'Context'), paragraphs(brief.significance));
  if (brief.mechanisms.length) add('mechanism', T('具体机制', 'Mechanism'), '<ol class="sig-mechanism">' + brief.mechanisms.map((item, index) => '<li><span>' + String(index + 1).padStart(2, '0') + '</span><div><h3>' + esc(item.title) + '</h3><p>' + esc(item.text) + '</p></div></li>').join('') + '</ol>');
  if (brief.actions.length) add('response', T('处置建议', 'Response options'), list(brief.actions));
  if (brief.watch.length || brief.questions.length) add('watch', T('后续核查', 'Follow-up checks'), list([...brief.watch, ...brief.questions]));
  if (rel.length) add('related', T('同主题记录', 'Topic context'), '<ol class="sig-related-grid">' + relationCards + '</ol>',
    T('按标题、研究方向、机构或类别匹配的延伸阅读。', 'Further reading matched by title, research direction, organisation, or category.'));

  main.innerHTML = '<article class="sig-story">'
    + '<header class="sig-hero">'
    + '<a class="sig-back" href="records.html">← ' + T('返回研究热点', 'Back to signals') + '</a>'
    + '<div class="sig-eyebrow"><span class="' + (isIncident(r) ? 'inc' : '') + '">' + esc(category(r)) + '</span><time datetime="' + esc(r.date) + '">' + esc(r.date) + '</time><span>' + esc(r.source) + '</span></div>'
    + '<h1>' + esc(recordTitle) + '</h1>'
    + (brief.reviewed ? '<p class="sig-deck">' + esc(brief.lead) + '</p>' : '')
    + '<div class="sig-hero-foot"><div class="sig-tags">' + directionTags + orgTags + '</div>'
    + '<a class="sig-source-button" href="' + esc(link(r)) + '" target="_blank" rel="noopener">' + T('查看原始来源', 'Open original source') + ' ↗</a></div>'
    + '</header>'
    + '<div class="sig-layout"><div class="sig-article">'
    + sections.map((section, index) => chapter(String(index + 1).padStart(2, '0'), section.id, section.heading, section.intro, section.body)).join('')
    + '</div>'
    + '<aside class="sig-rail"><section class="sig-rail-card sig-contents"><h2>' + T('本页目录', 'Contents') + '</h2><ol>'
    + sections.map((section, index) => '<li><a href="#' + section.id + '"><span>' + String(index + 1).padStart(2, '0') + '</span>' + section.heading + '</a></li>').join('') + '</ol></section>'
    + '<section class="sig-rail-card"><h2>' + T('记录信息', 'Record details') + '</h2><dl class="sig-facts">'
    + '<dt>' + T('类别', 'Type') + '</dt><dd>' + esc(category(r)) + '</dd>'
    + '<dt>' + T('来源', 'Source') + '</dt><dd>' + esc(r.source) + (host(link(r)) ? '<small>' + esc(host(link(r))) + '</small>' : '') + '</dd>'
    + '<dt>' + T('记录日期', 'Record date') + '</dt><dd>' + esc(r.date) + '<small>' + W.ago(r.date) + '</small></dd>'
    + '</dl><div class="sig-rail-tags">' + directionTags + orgTags + '</div></section>'
    + (datedContext.length ? '<section class="sig-rail-card sig-timeline"><h2>' + T('同主题记录日期', 'Topic records by date') + '</h2><ol>'
      + datedContext.map(x => '<li><time datetime="' + esc(x.date) + '">' + esc(x.date) + '</time><a href="' + W.href(x) + '">' + esc(title(x)) + '</a></li>').join('')
      + '</ol></section>' : '') + '</aside></div></article>';
})();
</script>
</body>
</html>
