<title data-en="AI Safety Index · what happened in AI safety this week">AI Safety Index · 本周 AI 安全动态</title>
<script>
/* Old single-page links used #route?params; send them to the matching new page before anything renders. */
(() => {
  const h = location.hash.slice(1);
  if (!h || h.startsWith('day-')) return;
  const [path, query = ''] = h.split('?');
  const p = new URLSearchParams(query), out = new URLSearchParams();
  const copy = (from, to = from) => { if (p.get(from)) out.set(to, p.get(from)); };
  copy('direction', 'dir'); copy('q');
  let page = 'index.html', frag = '';
  const [head, id] = path.split('/');
  if (head === 'resource' && id) { page = 'detail.html'; out.set('id', decodeURIComponent(id)); }
  else if (head === 'news' && id) { page = 'records.html'; out.set('item', decodeURIComponent(id)); }
  else if (head === 'benchmark' && id) {
    const b = decodeURIComponent(id);
    if (['helm-safety', 'agentdojo', 'safevla', 'flames', 'finsafety'].includes(b)) { page = 'results.html'; out.set('benchmark', b); }
    else { page = 'benchmarks.html'; out.set('related', '1'); out.set('q', b); }
  }
  else switch (head) {
    case 'home': break;
    case 'directions': page = 'directions.html'; break;
    case 'papers': page = 'papers.html'; break;
    case 'map': case 'research-map': page = 'research-map.html'; out.set('view', p.get('mode') === 'citations' ? 'citations' : p.get('mode') === 'library' ? 'library' : p.get('paper') ? 'paper' : 'topics'); copy('paper'); break;
    case 'datasets': page = 'benchmarks.html'; frag = '#datasets'; break;
    case 'news': case 'watch': case 'trends': page = 'records.html'; if (p.get('content') === 'analysis') out.set('kind', 'analysis'); if (p.get('content') === 'latest') out.set('kind', 'latest'); break;
    case 'results': page = 'results.html'; copy('benchmark'); copy('task'); copy('config'); copy('metric'); break;
    case 'benchmarks': case 'resources': case 'sources': page = 'benchmarks.html'; copy('topic'); break;
    case 'methods': page = 'methods.html'; break;
    case 'upload': page = 'upload.html'; break;
    case 'teams': case 'about': page = 'about.html'; break;
    case 'contact': page = /join/.test(query) ? 'about.html' : /resource/.test(query) ? 'upload.html' : 'results.html'; break;
    default: return;
  }
  const qs = out.toString();
  location.replace(page + (qs ? '?' + qs : '') + frag);
})();
</script>

<script>
(() => {
  const S = Shell, N = S.news, { esc, iso, md, day, DAY, title, link, isIncident, dirName, T, en } = S;
  S.header('index.html');
  const state = { dir: S.dirParam(), role: 'all', sortKey: 'signals', order: -1, open: null };
  const inDir = r => state.dir === 'all' || (r.direction_ids || []).includes(state.dir);
  const dirLabel = () => state.dir === 'all' ? '' : T('（' + dirName(state.dir) + '）', ' (' + dirName(state.dir) + ')');
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  const renderDirs = S.dirSeg(document.getElementById('dirs'), () => state.dir,
    id => N.signals.filter(r => id === 'all' || (r.direction_ids || []).includes(id)).length,
    id => { state.dir = id; state.open = null; renderAll(); });

  /* editorial feed: lead story, two more, a numbered log, and a trending column */
  const W = News;
  const kick = (r, extra) => '<div class="kick"><b class="' + (isIncident(r) ? 'inc' : '') + '">' + esc(S.category(r)) + '</b>' + (extra || '')
    + '<time datetime="' + esc(r.date) + '">' + md(r.date) + '</time><span>' + W.ago(r.date) + '</span></div>';
  const meta = (r, n) => '<div class="meta"><strong>' + esc(r.source) + '</strong>'
    + ((r.direction_ids || []).length ? '<span class="tg">' + r.direction_ids.map(d => '<span>' + esc(dirName(d)) + '</span>').join('') + '</span>' : '')
    + (n ? '<a href="' + W.href(r) + '">' + T('⧉ ' + n + ' 条相关', '⧉ ' + n + ' related') + '</a>' : '')
    + '<a href="' + esc(link(r)) + '" target="_blank" rel="noopener">' + T('原文 ↗', 'Original ↗') + '</a></div>';
  const sum = r => S.desc(r) ? '<p class="sum">' + esc(S.desc(r)) + '</p>' : '';
  function renderNews() {
    const from14 = iso(N.days[0]);
    const pool = N.signals.filter(inDir);
    const recent = pool.filter(r => r.date >= from14).sort((a, b) => b.date.localeCompare(a.date));
    const heat = new Map(recent.map(r => [r.id, W.heat(r, N.signals)]));
    const relN = new Map(recent.map(r => [r.id, W.related(r, N.signals, 30, 99).length]));
    const byHeat = recent.slice().sort((a, b) => heat.get(b.id) - heat.get(a.id) || b.date.localeCompare(a.date));
    const fresh = recent.filter(r => N.ref - day(r.date) <= 7 * DAY);
    const lead = (fresh.length ? fresh : recent).slice().sort((a, b) => heat.get(b.id) - heat.get(a.id))[0];
    const leadEl = document.getElementById('lead'), pairEl = document.getElementById('pair'), logEl = document.getElementById('log');
    if (!lead) {
      leadEl.innerHTML = '<p class="sum">' + T('这个方向近 14 天没有新信号。', 'No signals in this direction in the last 14 days.') + '</p>';
      pairEl.innerHTML = logEl.innerHTML = document.getElementById('trend').innerHTML = '';
      document.getElementById('log-sub').textContent = '';
    } else {
      leadEl.innerHTML = kick(lead, '<span>' + T('头条', 'Lead') + '</span>') + '<a class="ttl" href="' + W.href(lead) + '">' + esc(title(lead)) + '</a>' + sum(lead) + meta(lead)
        + '<div class="more">' + (relN.get(lead.id) ? '<a href="' + W.href(lead) + '"><small>' + T('事件', 'Story') + '</small>' + T(relN.get(lead.id) + ' 条相关记录，展开完整事件 →', relN.get(lead.id) + ' related records, open the full story →') + '</a>' : '<a href="' + W.href(lead) + '"><small>' + T('详情', 'Detail') + '</small>' + T('查看详情 →', 'Open →') + '</a>')
        + ((lead.direction_ids || [])[0] ? '<a href="directions.html?dir=' + encodeURIComponent(lead.direction_ids[0]) + '"><small>' + T('方向', 'Direction') + '</small>' + esc(dirName(lead.direction_ids[0])) + ' →</a>' : '') + '</div>';
      const pair = recent.filter(r => r.id !== lead.id).slice(0, 2);
      pairEl.innerHTML = pair.map(r => '<article class="story">' + kick(r) + '<a class="ttl" href="' + W.href(r) + '">' + esc(title(r)) + '</a>' + sum(r) + meta(r, relN.get(r.id)) + '</article>').join('');
      const shown = new Set([lead.id, ...pair.map(r => r.id)]);
      const log = recent.filter(r => !shown.has(r.id));
      document.getElementById('log-sub').textContent = T(log.length + ' 条 · 按时间倒序', log.length + ' · newest first');
      logEl.innerHTML = log.map((r, k) => '<li class="logrow"><span class="no">' + String(k + 4).padStart(2, '0') + '</span><div>'
        + '<div class="hd"><b class="' + (isIncident(r) ? 'inc' : '') + '">' + esc(S.category(r)) + '</b><a class="ttl" href="' + W.href(r) + '">' + esc(title(r)) + '</a></div>'
        + sum(r) + meta(r, relN.get(r.id)) + '</div></li>').join('') || '<li class="empty">' + T('没有更多记录。', 'Nothing more.') + '</li>';
      document.getElementById('trend').innerHTML = byHeat.slice(0, 8).map((r, k) => '<li><span class="rk">' + String(k + 1).padStart(2, '0') + '</span><div>'
        + '<a class="ttl" href="' + W.href(r) + '">' + esc(title(r)) + '</a>' + sum(r)
        + '<div class="meta"><strong>' + (relN.get(r.id) ? T(relN.get(r.id) + ' 条相关', relN.get(r.id) + ' related') : esc(S.category(r))) + '</strong><span>' + md(r.date) + '</span></div></div></li>').join('');
    }
    const all14 = N.signals.filter(r => r.date >= from14);
    document.getElementById('topics').innerHTML = S.DIRS.map(([d]) => [d, all14.filter(r => (r.direction_ids || []).includes(d)).length])
      .sort((a, b) => b[1] - a[1]).map(([d, n]) => '<li><a href="directions.html?dir=' + encodeURIComponent(d) + '">' + esc(dirName(d)) + '<span>' + T(n + ' 条', n + '') + '</span></a></li>').join('');
  }
  const EVALUATORS = new Set(['uk-aisi', 'metr', 'nist']);
  const COLS = [
    { k: 'name', label: T('机构', 'Organisation') }, { k: 'signals', label: T('信号', 'Signals'), num: true }, { k: 'incidents', label: T('其中安全事件', 'Incidents'), num: true },
    { label: T('每日安全事件', 'Incidents by day') }, { label: T('最新一条', 'Latest') }
  ];
  const tbody = document.getElementById('tbody');
  S.sortHead(document.getElementById('thead'), COLS, state, () => renderScore());
  function renderScore() {
    const orgs = {};
    for (const r of N.recent.filter(inDir)) for (const id of r.orgs || []) {
      const o = orgs[id] ||= { id, name: S.orgName(id), role: EVALUATORS.has(id) ? 'eval' : 'lab', signals: 0, incidents: 0, days: {}, latest: null };
      o.signals++; if (isIncident(r)) { o.incidents++; o.days[r.date] = (o.days[r.date] || 0) + 1; }
      if (!o.latest || r.date > o.latest.date) o.latest = r;
    }
    const rows = Object.values(orgs);
    const list = rows.filter(o => state.role === 'all' || o.role === state.role).sort((a, b) => {
      const x = a[state.sortKey], y = b[state.sortKey];
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.order || b.signals - a.signals;
    });
    const maxD = Math.max(1, ...rows.flatMap(o => Object.values(o.days)));
    tbody.innerHTML = list.length ? list.map(o => {
      const bars = N.days.map(d => {
        const k = iso(d), v = o.days[k] || 0;
        if (d > N.lastCollected || d < N.firstDay) return '<i class="g" title="' + k + T('：尚未采集', ': not collected yet') + '"></i>';
        return '<i class="' + (v ? '' : 'z') + '" style="height:' + (v ? Math.max(18, v / maxD * 100) : 8) + '%" title="' + k + T('：' + v + ' 起', ': ' + v) + '"></i>';
      }).join('');
      const l = o.latest;
      return '<tr><td><div class="org">' + esc(o.name) + '</div><div class="role">' + (o.role === 'lab' ? T('模型公司', 'AI developer') : T('评测与研究机构', 'Evaluator or researcher')) + '</div></td>'
        + '<td class="num">' + o.signals + '</td><td class="num' + (o.incidents ? '' : ' zero') + '">' + o.incidents + '</td>'
        + '<td><div class="week" style="--days:' + N.span + '">' + bars + '</div></td>'
        + '<td class="latest">' + (l ? '<a href="' + News.href(l) + '">' + esc(title(l)) + '</a><small>' + esc(l.source) + ' · ' + md(l.date) + '</small>' : '') + '</td></tr>';
    }).join('') : '<tr><td class="empty" colspan="5">' + T('这个范围内近 30 天没有标注机构的记录。', 'No records tagged with an organisation in this scope in the last 30 days.') + '</td></tr>';
    const n = N.recent.filter(inDir).length, from = N.since30 > S.iso(N.firstDay) ? N.since30 : S.iso(N.firstDay);
    document.getElementById('score-sub').textContent = T('统计 ' + from + ' 至 ' + iso(N.lastCollected) + ' 采集的 ' + n + ' 条记录' + dirLabel() + '，点击表头排序',
      plural(n, 'record') + ' collected ' + from + ' to ' + iso(N.lastCollected) + dirLabel() + '. Select a column header to sort.');
  }
  S.seg(document.getElementById('roles'), v => { state.role = v; renderScore(); });

  function renderPapers() {
    const list = S.picks.filter(p => state.dir === 'all' || (p.direction_ids || []).includes(state.dir));
    const sec = document.getElementById('reads').closest('section');
    sec.hidden = !list.length;
    document.getElementById('reads-sub').textContent = T('arXiv 近 7 天的安全相关新论文，共 ' + list.length + ' 篇。', plural(list.length, 'paper') + ' on AI safety from the last 7 days of arXiv.');
    document.getElementById('reads').innerHTML = S.picksHTML(list);
  }


  /* signal crawler: the last 14 days of signals, routed into research directions */
  const web = (() => {
    let RECS = [];
    const recs = () => {
      const from14 = iso(N.days[0]);
      return N.signals.filter(r => r.date >= from14 && (r.direction_ids || []).length).filter(inDir)
        .sort((a, b) => b.date.localeCompare(a.date)).reverse()
        .map(r => ({ r, inc: isIncident(r) }));
    };
    const peek = document.getElementById('peek');
    let shownAt = 0;
    function show(i, auto) {
      if (!RECS[i]) return;
      if (auto && performance.now() - shownAt < 1100) return; // fast animation, readable card
      shownAt = performance.now();
      const { r, inc } = RECS[i], desc = S.desc(r);
      peek.innerHTML = '<div class="k"><b class="' + (inc ? '' : 'sig') + '">' + (inc ? T('安全事件', 'Incident') : T('安全信号', 'Signal')) + '</b>' + esc(r.date) + ' · ' + esc(r.source)
        + ' · ' + (r.direction_ids || []).map(dirName).map(esc).join(T('、', ', ')) + '<span class="n">' + T('累计 ' + RECS.length + ' 条', RECS.length + ' collected') + '</span></div>'
        + '<h3><a href="' + News.href(r) + '">' + esc(title(r)) + '</a></h3>'
        + (desc ? '<p>' + esc(desc) + '</p>' : '');
    }
    RECS = recs();
    if (!window.mountSignalWeb) { document.querySelector('.crawl').hidden = true; return { update() {} }; }
    const api = window.mountSignalWeb(document.getElementById('web'), { records: RECS, dirs: S.DIRS.map(d => d[0]), dirName, T, link, titleOf: title, href: News.href, onFocus: show });
    show(RECS.length - 1);
    return {
      update() {
        RECS = recs(); api.setRecords(RECS); shownAt = 0; show(RECS.length - 1);
      }
    };
  })();

  function applySnapshot(snapshot) {
    if (!snapshot || !snapshot.info || !Array.isArray(snapshot.records)) return;
    N.all.splice(0, N.all.length, ...snapshot.records);
    N.signals = N.all;
    N.info = snapshot.info;
    N.generated = snapshot.info.generated_on ? new Date(snapshot.info.generated_on) : null;
    N.today = new Date();
    N.today.setHours(0, 0, 0, 0);
    const dates = N.all.map(r => r.date).filter(Boolean).sort();
    N.firstDay = dates.length ? day(dates[0]) : N.today;
    N.lastCollected = N.generated && !Number.isNaN(N.generated.getTime())
      ? new Date(N.generated.getFullYear(), N.generated.getMonth(), N.generated.getDate())
      : dates.length ? day(dates.at(-1)) : N.today;
    N.since30 = iso(new Date(N.today.getTime() - 29 * DAY));
    N.recent = N.all.filter(r => r.date >= N.since30);
    N.days = Array.from({ length: N.span }, (_, i) => new Date(N.today.getTime() - (N.span - 1 - i) * DAY));
    N.ref = N.generated && !Number.isNaN(N.generated.getTime()) ? N.generated : N.today;
    renderDirs();
    renderAll();
  }

  function renderAll() { web.update(); renderNews(); renderScore(); renderPapers(); }
  renderAll();
  if (window.HomeLive) {
    window.addEventListener(HomeLive.EVENT, event => applySnapshot(event.detail));
    HomeLive.start();
  }
})();
</script>
