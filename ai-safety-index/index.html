<title data-en="AI Safety Index · what happened in AI safety this week">AI Safety Index · 本周 AI 安全动态</title>
<script>
/* Old single-page links used #route?params; send them to the matching new page before anything renders. */
(() => {
  const h = location.hash.slice(1);
  if (!h || h.startsWith('day-')) return;
  const [path, query = ''] = h.split('?');
  const p = new URLSearchParams(query), out = new URLSearchParams();
  const copy = (from, to = from) => { if (p.get(from)) out.set(to, p.get(from)); };
  copy('direction', 'dir'); copy('q');
  let page = 'index.html', frag = '';
  const [head, id] = path.split('/');
  if (head === 'resource' && id) { page = 'detail.html'; out.set('id', decodeURIComponent(id)); }
  else if (head === 'news' && id) { page = 'records.html'; out.set('item', decodeURIComponent(id)); }
  else if (head === 'benchmark' && id) {
    const b = decodeURIComponent(id);
    if (['helm-safety', 'agentdojo', 'safevla', 'flames', 'finsafety'].includes(b)) { page = 'results.html'; out.set('benchmark', b); }
    else { page = 'benchmarks.html'; out.set('related', '1'); out.set('q', b); }
  }
  else switch (head) {
    case 'home': break;
    case 'directions': page = 'directions.html'; break;
    case 'papers': page = 'papers.html'; break;
    case 'map': case 'research-map': page = 'research-map.html'; out.set('view', p.get('mode') === 'citations' ? 'citations' : p.get('mode') === 'library' ? 'library' : p.get('paper') ? 'paper' : 'topics'); copy('paper'); break;
    case 'datasets': page = 'benchmarks.html'; frag = '#datasets'; break;
    case 'news': case 'watch': case 'trends': page = 'records.html'; if (p.get('content') === 'analysis') out.set('kind', 'analysis'); if (p.get('content') === 'latest') out.set('kind', 'latest'); break;
    case 'results': page = 'results.html'; copy('benchmark'); copy('task'); copy('config'); copy('metric'); break;
    case 'benchmarks': case 'resources': case 'sources': page = 'benchmarks.html'; copy('topic'); break;
    case 'methods': page = 'methods.html'; break;
    case 'upload': page = 'upload.html'; break;
    case 'teams': case 'about': page = 'about.html'; break;
    case 'contact': page = /join/.test(query) ? 'about.html' : /resource/.test(query) ? 'upload.html' : 'results.html'; break;
    default: return;
  }
  const qs = out.toString();
  location.replace(page + (qs ? '?' + qs : '') + frag);
})();
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell.css">

<main class="wrap">
  <nav class="dirs" aria-label="按研究方向筛选" data-en-aria-label="Filter by research direction">
    <div class="seg seg-dirs" role="group" aria-label="研究方向" data-en-aria-label="Research direction" id="dirs"></div>

  <section class="crawler-viz" id="crawler-viz" aria-labelledby="crawler-title">

    <header class="crawler-head">

      </div>
      <dl class="crawler-metrics">
        <div><dt data-en="Sources">来源</dt><dd id="crawler-source-count">--</dd></div>

  <section class="top">

      <figure class="art">

<script src="signals-feed.js"></script>
<script src="paper-picks.js"></script>
<script src="i18n.js"></script>
<script src="shell.js"></script>
<script src="home-crawler.js"></script>
<script src="signal-web.js?v=6"></script>
<script>
(() => {
  const S = Shell, N = S.news, { esc, iso, md, day, DAY, title, link, isIncident, dirName, T, en } = S;
  S.header('index.html');
  const state = { dir: S.dirParam(), role: 'all', sortKey: 'signals', order: -1, open: null };
  const crawler = HomeCrawler.mount(document.getElementById('crawler-viz'));
  const inDir = r => state.dir === 'all' || (r.direction_ids || []).includes(state.dir);
  const dirLabel = () => state.dir === 'all' ? '' : T('（' + dirName(state.dir) + '）', ' (' + dirName(state.dir) + ')');
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  S.dirSeg(document.getElementById('dirs'), () => state.dir,
    id => N.signals.filter(r => id === 'all' || (r.direction_ids || []).includes(id)).length,
    id => { state.dir = id; state.open = null; renderAll(); });

  function renderBoard() {
    const incidents = N.signals.filter(inDir).filter(isIncident).sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById('board-title').textContent = state.dir === 'all'
      ? T('近期收录事件', 'Recent incidents')
      : T('近期收录事件 · ' + dirName(state.dir), 'Recent incidents · ' + dirName(state.dir));
    const count = document.getElementById('count'), last = document.getElementById('last');
    const from = iso(N.days[0]);
    const inWindow = incidents.filter(r => r.date >= from);
    const n = inWindow.length;
    count.innerHTML = S.plates(n, T(n + ' 起', plural(n, 'incident'))) + '<span class="unit">' + T('起', n === 1 ? 'incident' : 'incidents') + '<small>' + T('近 ' + N.span + ' 天', 'last ' + N.span + ' days') + '</small></span>';
    if (incidents.length) {
      const top = incidents[0];
      last.innerHTML = '<dt>' + T('最新一条', 'Latest') + '</dt><dd><a href="' + esc(link(top)) + '" rel="noopener">' + esc(title(top)) + '</a></dd>'
        + '<dt>' + T('来源', 'Source') + '</dt><dd class="meta">' + esc(top.source) + ' · ' + esc(top.date) + '</dd>';
    } else {
      last.innerHTML = '<dt>' + T('最新一条', 'Latest') + '</dt><dd>' + T('这个方向暂无收录事件。', 'No incidents recorded in this direction yet.') + '</dd>';
    }
    const perDay = {};
    for (const r of incidents) (perDay[r.date] ||= []).push(r);
    const strip = document.getElementById('strip');
    strip.style.setProperty('--days', N.span);
    strip.innerHTML = S.stripHTML(perDay);
  }

  const feed = document.getElementById('feed');
  S.bindItems(feed, state);
  function renderFeed() {
    const recent = N.signals.filter(inDir).filter(r => N.ref - day(r.date) <= 7 * DAY);
    const top = recent.slice().sort((a, b) => b.date.localeCompare(a.date) || (isIncident(a) ? 0 : 1) - (isIncident(b) ? 0 : 1)).slice(0, 6);
    document.getElementById('feed-sub').textContent = T('近 7 天共 ' + recent.length + ' 条，按日期排列，点击展开摘要', plural(recent.length, 'record') + ' in the last 7 days, newest first. Select one for its summary.');
    feed.innerHTML = top.length ? top.map(r => S.itemHTML(r, state.open === r.id)).join('') : '<li class="empty">' + T('这个方向近 7 天没有新信号。', 'No new signals in this direction in the last 7 days.') + '</li>';
  }

  const EVALUATORS = new Set(['uk-aisi', 'metr', 'nist']);
  const COLS = [
    { k: 'name', label: T('机构', 'Organisation') }, { k: 'signals', label: T('信号', 'Signals'), num: true }, { k: 'incidents', label: T('其中安全事件', 'Incidents'), num: true },
    { label: T('每日安全事件', 'Incidents by day') }, { label: T('最新一条', 'Latest') }
  ];
  const tbody = document.getElementById('tbody');
  S.sortHead(document.getElementById('thead'), COLS, state, () => renderScore());
  function renderScore() {
    const orgs = {};
    for (const r of N.recent.filter(inDir)) for (const id of r.orgs || []) {
      const o = orgs[id] ||= { id, name: S.orgName(id), role: EVALUATORS.has(id) ? 'eval' : 'lab', signals: 0, incidents: 0, days: {}, latest: null };
      o.signals++; if (isIncident(r)) { o.incidents++; o.days[r.date] = (o.days[r.date] || 0) + 1; }
      if (!o.latest || r.date > o.latest.date) o.latest = r;
    }
    const rows = Object.values(orgs);
    const list = rows.filter(o => state.role === 'all' || o.role === state.role).sort((a, b) => {
      const x = a[state.sortKey], y = b[state.sortKey];
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.order || b.signals - a.signals;
    });
    const maxD = Math.max(1, ...rows.flatMap(o => Object.values(o.days)));
    tbody.innerHTML = list.length ? list.map(o => {
      const bars = N.days.map(d => {
        const k = iso(d), v = o.days[k] || 0;
        if (d > N.lastCollected || d < N.firstDay) return '<i class="g" title="' + k + T('：尚未采集', ': not collected yet') + '"></i>';
        return '<i class="' + (v ? '' : 'z') + '" style="height:' + (v ? Math.max(18, v / maxD * 100) : 8) + '%" title="' + k + T('：' + v + ' 起', ': ' + v) + '"></i>';
      }).join('');
      const l = o.latest;
      return '<tr><td><div class="org">' + esc(o.name) + '</div><div class="role">' + (o.role === 'lab' ? T('模型公司', 'AI developer') : T('评测与研究机构', 'Evaluator or researcher')) + '</div></td>'
        + '<td class="num">' + o.signals + '</td><td class="num' + (o.incidents ? '' : ' zero') + '">' + o.incidents + '</td>'
        + '<td><div class="week" style="--days:' + N.span + '">' + bars + '</div></td>'
        + '<td class="latest">' + (l ? '<a href="' + esc(link(l)) + '" rel="noopener">' + esc(title(l)) + '</a><small>' + esc(l.source) + ' · ' + md(l.date) + '</small>' : '') + '</td></tr>';
    }).join('') : '<tr><td class="empty" colspan="5">' + T('这个范围内近 30 天没有标注机构的记录。', 'No records tagged with an organisation in this scope in the last 30 days.') + '</td></tr>';
    const n = N.recent.filter(inDir).length, from = N.since30 > S.iso(N.firstDay) ? N.since30 : S.iso(N.firstDay);
    document.getElementById('score-sub').textContent = T('统计 ' + from + ' 至 ' + iso(N.lastCollected) + ' 采集的 ' + n + ' 条记录' + dirLabel() + '，点击表头排序',
      plural(n, 'record') + ' collected ' + from + ' to ' + iso(N.lastCollected) + dirLabel() + '. Select a column header to sort.');
  }
  S.seg(document.getElementById('roles'), v => { state.role = v; renderScore(); });

  function renderPapers() {
    const list = S.picks.filter(p => state.dir === 'all' || (p.direction_ids || []).includes(state.dir));
    const sec = document.getElementById('reads').closest('section');
    sec.hidden = !list.length;
    document.getElementById('reads-sub').textContent = T('arXiv 近 7 天的安全相关新论文，共 ' + list.length + ' 篇。', plural(list.length, 'paper') + ' on AI safety from the last 7 days of arXiv.');
    document.getElementById('reads').innerHTML = S.picksHTML(list);
  }


  /* signal crawler: the last 14 days of signals, routed into research directions */
  (() => {
    const from14 = iso(N.days[0]);
    const RECS = N.signals.filter(r => r.date >= from14 && (r.direction_ids || []).length)
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 48).reverse()
      .map(r => ({ r, inc: isIncident(r) }));
    const peek = document.getElementById('peek');
    let shownAt = 0;
    function show(i, auto) {
      if (!RECS[i]) return;
      if (auto && performance.now() - shownAt < 1100) return; // fast animation, readable card
      shownAt = performance.now();
      const { r, inc } = RECS[i], desc = r.description || '';
      peek.innerHTML = '<div class="k"><b class="' + (inc ? '' : 'sig') + '">' + (inc ? T('安全事件', 'Incident') : T('安全信号', 'Signal')) + '</b>' + esc(r.date) + ' · ' + esc(r.source)
        + ' · ' + (r.direction_ids || []).map(dirName).map(esc).join(T('、', ', ')) + '<span class="n">' + (i + 1) + ' / ' + RECS.length + '</span></div>'
        + '<h3><a href="' + esc(link(r)) + '" target="_blank" rel="noopener">' + esc(title(r)) + '</a></h3>'
        + (desc ? '<p>' + esc(desc) + '</p>' : '');
    }
    if (!RECS.length || !window.mountSignalWeb) { document.querySelector('.crawl').hidden = true; return; }
    window.mountSignalWeb(document.getElementById('web'), { records: RECS, dirs: S.DIRS.map(d => d[0]), dirName, T, link, onFocus: show });
    show(RECS.length - 1);
  })();

  function renderAll() { crawler.setDirection(state.dir); renderBoard(); renderFeed(); renderScore(); renderPapers(); }
  renderAll();
})();
</script>
</body>
</html>
